<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <link href="favicon trivia.png" rel="icon">
        <title>QuizMe</title>
        <script>
            // Add code to check answers to questions
            function checkb(event)
            {
                var trobj = event.srcElement;
                let divb = trobj.parentElement;
                if (trobj.dataset.correct == "true")
                {
                    trobj.style.backgroundColor = "green";
                    divb.innerHTML = "<p>Correct!</p>" + divb.innerHTML;
                }
                else
                {
                    trobj.style.backgroundColor = "red";
                    trobj.style.opacity = 0.7;
                    divb.innerHTML = "<p>Incorrect.</p>" + divb.innerHTML;
                }
                let qclass = trobj.className;
                for (var button of (document.querySelectorAll("." + qclass)))
                {
                    button.disabled = true;
                }
            }

            function checki(event)
            {
                trobj = event.srcElement;
                let divi = trobj.parentElement;
                if (trobj.id == "Q1")
                {
                    if (parseInt(document.getElementById('A1').value) == 2022)
                    {
                        document.getElementById('A1').style.backgroundColor = "green";
                        divi.innerHTML = "<p>Correct!</p>" + divi.innerHTML;
                    }
                    else
                    {
                        document.getElementById('A1').style.backgroundColor = "red";
                        divi.innerHTML = "<p>Incorrect.</p>" + divi.innerHTML;
                    }
                }

                if (trobj.id == "Q2")
                {
                    if (parseInt(document.getElementById('A2').value) == 0)
                    {
                        document.getElementById('A2').style.backgroundColor = "green";
                        divi.innerHTML = "<p>Correct!</p>" + divi.innerHTML;
                    }
                    else
                    {
                        document.getElementById('A2').style.backgroundColor = "red";
                        divi.innerHTML = "<p>Incorrect.</p>" + divi.innerHTML;
                    }
                }

                if (trobj.id == "Q3")
                {
                    if (parseInt(document.getElementById('A3').value) == 2007)
                    {
                        document.getElementById('A3').style.backgroundColor = "green";
                        divi.innerHTML = "<p>Correct!</p>" + divi.innerHTML;
                    }
                    else
                    {
                        document.getElementById('A3').style.backgroundColor = "red";
                        divi.innerHTML = "<p>Incorrect.</p>" + divi.innerHTML;
                    }
                }
            }
        </script>
    </head>
    <body>
        <div class="header">
            <h1>QuizMe!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- Adding multiple choice question here -->
                <h3>Who invented the aeroplane?</h3>
                <div id="p1">
                    <button class="q1" data-correct="true" onclick="checkb(event)">Wright Brothers</button>
                    <button class="q1" onclick="checkb(event)">Elon Musk</button>
                    <button class="q1" onclick="checkb(event)">Ravi Kishan</button>
                    <button class="q1" onclick="checkb(event)">Nikola Tesla</button>
                </div>

                <h3>Who is Pep Guardiola?</h3>
                <div id="p2">
                    <button class="q2" onclick="checkb(event)">Politician</button>
                    <button class="q2" onclick="checkb(event)">Artist</button>
                    <button class="q2" data-correct="true" onclick="checkb(event)">Football Manager</button>
                    <button class="q2" onclick="checkb(event)">Famous chef</button>
                </div>

                <h3>Who is Horrid Henry's brother?</h3>
                <div id="p3">
                    <button class="q3" onclick="checkb(event)">Margaret</button>
                    <button class="q3" data-correct="true" onclick="checkb(event)">Peter</button>
                    <button class="q3" onclick="checkb(event)">Sunio</button>
                    <button class="q3" onclick="checkb(event)">Raju</button>
                </div>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- Adding free response question here -->
                <h3>When did Lionel Messi win the FIFA World Cup?</h3>
                <div id="p4">
                    <input autocomplete="off" id="A1" name="year1" placeholder="Answer">
                    <button onclick="checki(event)" id="Q1">Confirm</button>
                </div>


                <h3>How many World Cups does Ronaldo have?</h3>
                <div id="p5">
                    <input autocomplete="off" id="A2" name="year2" placeholder="Answer">
                    <button onclick="checki(event)" id="Q2">Confirm</button>
                </div>

                <h3>In which year was Akshya Kaushik born? ;) </h3>
                <div id="p6">
                    <input autocomplete="off" id="A3" name="year3" placeholder="Answer">
                    <button onclick="checki(event)" id="Q3">Confirm</button>
                </div>
            </div>
        </div>
    </body>
</html>
